name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'supabase/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name dealproof .
      - name: Ensure Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET"/>\n'
          if "android.permission.INTERNET" not in manifest:
              end = manifest.find(">")
              if end < 0:
                  raise SystemExit("Invalid AndroidManifest.xml")
              manifest = manifest[:end + 1] + "\n" + permission + manifest[end + 1:]
              path.write_text(manifest)
          print("Android INTERNET permission verified.")
          PY
      - name: Configure Android auth deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          if 'android:scheme="dealproof"' not in manifest:
              activity = re.search(r'(<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*>)([\s\\S]*?)(</activity>)', manifest)
              if not activity:
                  raise SystemExit("MainActivity not found in AndroidManifest.xml")
              intent = """
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="dealproof" android:host="login-callback" />
                      </intent-filter>
              """
              manifest = manifest[:activity.start(3)] + intent + manifest[activity.start(3):]
              path.write_text(manifest)
          print("DEALPROOF auth deep link configured.")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Check Dart code
        run: flutter analyze lib --no-fatal-infos
      - name: Verify Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo 'Missing GitHub secret: SUPABASE_URL'; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo 'Missing GitHub secret: SUPABASE_ANON_KEY'; exit 1; }
          case "$SUPABASE_URL" in https://*) ;; *) echo 'SUPABASE_URL must start with https://'; exit 1;; esac
          echo 'Both Supabase secrets are configured.'
      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dealproof-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
